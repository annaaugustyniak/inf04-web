<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Wizytkowka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>Anna Augustyniak</header>
    <main>
    <section id="skills">
        <h4>Lista technologii</h4>
        <ol>
            <li>React</li>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>PHP</li>
        </ol>
        
    </section>
    <section id="contact-form">
        <form action="">
            <label for="name">imie</label>
            <input type="text" name="name" id="name" required>
            <label for="email">e-mail</label>
            <input type="email" name="email" id="email" required>
            <label for="topic">temat</label>
            <select name="topic" id="topic">
                <option value="1">opcja 1</option>
                <option value="2">opcja 2</option>
                <option value="3">opcja 3</option>
            </select>
            <label for="message">wiadomosc</label>
            <textarea name="message" id="message" rows="4" placeholder="wpisz wiadomos...">
            </textarea>
            <button type="button">przycisk</button>
        </form>
        <img src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png" alt="profile pic">    
        </section>
    </main>
</body>
</html>
